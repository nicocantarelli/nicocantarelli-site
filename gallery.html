<link rel="icon" href="/favicon.svg" type="image/svg+xml">

<style>
  @font-face {
    font-family: 'Helvetica Now Display';
    src: url('/fonts/HelveticaNowDisplay.woff2') format('woff2');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'Helvetica Now Display';
    src: url('/fonts/HelveticaNowDisplayMedium.woff2') format('woff2');
    font-weight: 500;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'Helvetica Now Display';
    src: url('/fonts/HelveticaNowDisplayBold.woff2') format('woff2');
    font-weight: 600 700;
    font-style: normal;
    font-display: swap;
  }
  :root {
    --bg: #FFFFFF;
    --ink: #111111;
    --dim: #6B6B68;
    --hair: #DDDDDA;
    --sans: "Helvetica Now Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  .wide { margin: 0; padding: 0 2.6666666667rem; }

  /* masthead + nav */
  header { padding: 48px 0 32px; border-bottom: 2px solid var(--ink); }
  .top { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 12px; }
  .name {
    font-weight: 700;
    font-size: clamp(1.2rem, 3.4vw, 1.9rem);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink);
    text-decoration: none;
  }
  nav { display: flex; gap: 28px; font-size: 1rem; }
  nav a { color: var(--dim); text-decoration: none; }
  nav a:hover, nav a[aria-current] { color: var(--ink); }
  .role { margin-top: 2px; color: var(--dim); font-size: 1.05rem; }

  /* gallery page */
  .dump { columns: 4; column-gap: 6px; padding: 40px 0 8px; }
  .dump picture { display: block; break-inside: avoid; }
  .dump img { width: 100%; height: auto; display: block; margin-bottom: 6px; break-inside: avoid; }
  @media (max-width: 1100px) { .dump { columns: 3; } }
  @media (max-width: 760px)  { .dump { columns: 2; } }

  /* footer */
  footer {
    padding: 44px 0 56px; display: flex; justify-content: space-between;
    flex-wrap: wrap; gap: 8px; font-size: 0.95rem; color: var(--dim);
  }
  footer a { color: var(--dim); text-decoration: none; border-bottom: 1px solid var(--hair); }
  footer a:hover { color: var(--ink); border-color: var(--ink); }
</style>
</head>
