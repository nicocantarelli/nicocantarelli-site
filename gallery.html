<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Gallery — Nicolas Cantarelli</title>
<meta name="description" content="Images made with generative tools by Nicolas Cantarelli.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.png" sizes="32x32" type="image/png">
<style>
  @font-face {
    font-family: 'Switzer';
    src: url('/fonts/Switzer-Variable.woff2') format('woff2');
    font-weight: 100 900;
    font-style: normal;
    font-display: swap;
  }
  :root {
    --bg: #FAFAFA;
    --ink: #111111;
    --dim: #6B6B68;
    --hair: #DDDDDA;
    --sans: "Switzer", -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  .wide { max-width: 1400px; margin: 0 auto; padding: 0 24px; }

  /* masthead + nav */
  header { padding: 40px 0 26px; border-bottom: 2px solid var(--ink); }
  .top { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 12px; }
  .name {
    font-weight: 700;
    font-size: clamp(1.2rem, 3.4vw, 1.6rem);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink);
    text-decoration: none;
  }
  nav { display: flex; gap: 22px; font-size: 0.9rem; }
  nav a { color: var(--dim); text-decoration: none; }
  nav a:hover, nav a[aria-current] { color: var(--ink); }
  .role { margin-top: 6px; color: var(--dim); font-size: 0.95rem; }

  /* gallery page */
  .dump { columns: 4; column-gap: 12px; padding: 34px 0 8px; }
  .dump picture { display: block; break-inside: avoid; }
  .dump img { width: 100%; height: auto; display: block; margin-bottom: 12px; break-inside: avoid; }
  @media (max-width: 1100px) { .dump { columns: 3; } }
  @media (max-width: 760px)  { .dump { columns: 2; } }

  /* footer */
  footer {
    padding: 36px 0 48px; display: flex; justify-content: space-between;
    flex-wrap: wrap; gap: 8px; font-size: 0.85rem; color: var(--dim);
  }
  footer a { color: var(--dim); text-decoration: none; border-bottom: 1px solid var(--hair); }
  footer a:hover { color: var(--ink); border-color: var(--ink); }
</style>
</head>

<div class="wide">

      <div class="top">
        <a class="name" href="/">Nicolas Cantarelli</a>
        <nav>

          <a href="/#contact">Contact</a>
